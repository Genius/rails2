name: Merge Rails LTS branch
on:
  - pull_request
  # schedule:
  #   - cron: 0 0-23 * * *
jobs:
  auto-update-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check changes in makandra/rails/2-3-lts
        id: check-changes
        run: |
          git fetch origin 2-3-lts-for-genius
          git fetch origin 2-3-lts
          git remote add makandra https://github.com/makandra/rails.git
          git fetch makandra 2-3-lts

          n_releases=$(git rev-list --count origin/2-3-lts..makandra/2-3-lts -- railslts-version/lib/railslts-version.rb)
          if [[ $n_releases -eq 0 ]]; then
            echo "cancel=true" >> $GITHUB_OUTPUT
          fi

      # - name: Cancel workflow if there is no change
      #   if: ${{ steps.check-changes.outputs.cancel == 'true' }}
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       core.info('Branches compared Genius/rails2/2-3-lts and makandra/rails/2-3-lts');
      #       core.info('No changes detected in railslts-version/lib/railslts-version.rb');
      #       core.info('Canceling workflow');

      #       github.rest.actions.cancelWorkflowRun({
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         run_id: context.runId
      #       });

      #       const delay = ms => new Promise(res => setTimeout(res, ms));
      #       while (true) {
      #         core.info('Waiting for workflow to cancel...');
      #         await delay(5000);
      #       }

      # - name: Update our copy of rails lts branch to the latest release
      #   run: |
      #     git checkout -b 2-3-lts origin/2-3-lts
      #     git merge --no-edit --ff-only $(git rev-list -n 1 origin/2-3-lts..makandra/2-3-lts -- railslts-version/lib/railslts-version.rb)
      #     git push origin

      - name: Grab diff
        id: git-diff
        run: |
          last_release_commit=$(git rev-list -n 1 origin/2-3-lts-for-genius..makandra/2-3-lts -- railslts-version/lib/railslts-version.rb)
          pretty_diff=$(git rev-list --pretty origin/2-3-lts-for-genius..$last_release_commit)

          echo "pretty_diff<<EOF" >> $GITHUB_OUTPUT
          echo "$pretty_diff" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or grab existing pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/workflows/scripts/pr.js');
            return script({github, context});

      - name: Build slack messages
        id: messages
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/workflows/scripts/mesages.js');
            return script({
              prLink: ${{ toJSON(fromJSON(steps.pr.outputs.result).html_url) }},
              diff: ${{ toJSON(steps.git-diff.outputs.pretty_diff) }};
            });

      - name: Send slack messages
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ${{ toJSON(fromJSON(steps.messages.outputs.result).text) }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(fromJSON(steps.messages.outputs.result).markdown) }}
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
