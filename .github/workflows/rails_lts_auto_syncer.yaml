name: Merge Rails LTS branch
on:
  - pull_request
  # schedule:
  #   - cron:  '0 0 15 ? * MON *'
jobs:
  auto-update-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Merge rails lts
        run: |
          git fetch origin hfsaito/test
          git remote add makandra https://github.com/makandra/rails.git
          git fetch makandra 2-3-lts

          git checkout -b 2-3-lts origin/2-3-lts
          git merge --no-edit --ff-only makandra/2-3-lts
          git push origin

          git checkout -b hfsaito/test origin/hfsaito/test
          git merge --no-edit --ff-only makandra/2-3-lts
          git push origin
      - name: Notify success
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "(New commits were merged in our forked Rails branch, update Genius!)[https://github.com/Genius/rails2/tree/hfsaito/test]"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: Create pull request on conflict
        if: ${{ failure() }}
        id: pr_conflict
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const result = await github.rest.pulls.create({
              owner,
              repo,
              title: 'Automated workflow failed to merge new Rails LTS commits',
              head: '2-3-lts',
              base: 'hfsaito/test',
              body: [
                'To resolve conflicts keep in mind following points:',
                '- Keep using ** in keyword arguments instead of `ruby2_keywords`',
                '- Keep rack < 2.0, allowing rack 1.6',
                '- Make sure we won\'t use the deprecated `-i` option in `pg_dump`',
              ].join('\n')
            });
            github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: result.data.number,
              labels: ['automated pr']
            });
            return result.data.html_url;
      - name: Notify failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "(There is conflict between Makandra (Rails LTS) and Genius forks for Rails 2)[steps.pr_conflict.outputs]"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
