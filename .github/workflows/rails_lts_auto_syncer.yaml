name: Merge Rails LTS branch
on:
  - pull_request
  # schedule:
  #   - cron: 0 0-23 * * *
jobs:
  auto-update-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check changes in makandra/rails/2-3-lts
        id: check-changes
        run: |
          git fetch origin hfsaito/test
          git fetch origin 2-3-lts
          git remote add makandra https://github.com/makandra/rails.git
          git fetch makandra 2-3-lts

          n_releases=$(git rev-list --count origin/2-3-lts..makandra/2-3-lts -- railslts-version/lib/railslts-version.rb)
          if [[ $n_releases -eq 0 ]]; then
            echo "cancel=true" >> $GITHUB_OUTPUT
          fi

      - name: Cancel workflow if there is no change
        if: ${{ steps.check-changes.outputs.cancel == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.info('Branches compared Genius/rails2/2-3-lts and makandra/rails/2-3-lts');
            core.info('No changes detected in railslts-version/lib/railslts-version.rb');
            core.info('Canceling workflow');

            github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

            const delay = ms => new Promise(res => setTimeout(res, ms));
            while (true) {
              core.info('Waiting for workflow to cancel...');
              await delay(5000);
            }

      - name: Update our copy of rails lts branch
        run: |
          git checkout -b 2-3-lts origin/2-3-lts
          git merge --no-edit --ff-only $(git rev-list -n 1 hfsaito/test..makandra/2-3-lts -- railslts-version/lib/railslts-version.rb)
          git push origin

      - name: Grab diff
        id: git-diff
        run: |
          pretty_diff=$(git rev-list --pretty origin/hfsaito/test..origin/2-3-lts)
          echo "pretty_diff=$pretty_diff" >> $GITHUB_OUTPUT

      - name: Create or grab existing pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;

            const resultPullsList = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: '2-3-lts',
              base: 'hfsaito/test',
            });
            const existingPr = resultPullsList.data[0];
            if (existingPr) {
              return existingPr;
            }

            const resultPullsCreate = await github.rest.pulls.create({
              owner,
              repo,
              title: '[Automated workflow] New Rails LTS commits',
              head: '2-3-lts',
              base: 'hfsaito/test',
              body: [
                'This is an automated PR to keep track of Rails LTS changes',
                '',
                'To resolve conflicts keep in mind following points:',
                '- Keep using ** in keyword arguments instead of `ruby2_keywords`',
                '- Keep rack < 2.0, allowing rack 1.6',
                '- Make sure we won\'t use the deprecated `-i` option in `pg_dump`',
              ].join('\n')
            });
            const newPr = resultPullsCreate.data;

            github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: newPr.number,
              labels: ['rails lts']
            });
            return newPr;

      - name: Notify slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "**New commits were merged in rails-lts!**"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "(Please review and deploy!)[${{ steps.pr.outputs.html_url }}]"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "```\n${{ steps.diff.outputs }}\n```"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
